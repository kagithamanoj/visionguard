name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless numpy fastapi "uvicorn[standard]" pydantic pytest boto3 python-multipart
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: python -m pytest tests/ -q
